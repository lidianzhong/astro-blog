name: Sync from Edit Branch

on:
  push:
    branches:
      - edit
  workflow_dispatch:  # Allow manual triggering
  # schedule:
  #   - cron: '0 * * * *'  # every hour

jobs:
  sync-to-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout edit branch
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Create temporary directory for blog content
        run: |
          mkdir -p temp_blog
          cp -r src/content/blog/* temp_blog/
      
      - name: Convert absolute URLs to relative URLs
        run: |
          python .github/scripts/convert_to_relative_urls.py temp_blog
      
      - name: Checkout dev branch
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin dev:dev
          git checkout dev
      
      - name: Sync blog content to dev branch
        run: |
          # Remove existing blog content
          rm -rf src/content/blog/*
          
          # Copy converted content
          cp -r temp_blog/* src/content/blog/
          
          # Add and commit changes
          git add src/content/blog
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Sync blog content from edit branch with relative URLs [skip ci]"
            git push origin dev
          else
            echo "No changes to commit"
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: sync-to-dev
    steps:
      - name: Checkout dev branch (latest after sync)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to cloud server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "dist/*"
          target: "/var/www/blog-site"
          strip_components: 1
          rm: true
