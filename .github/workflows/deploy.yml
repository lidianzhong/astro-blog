name: Deploy to Cloud Server

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "dist/*"
          target: "/var/www/blog-site"
          strip_components: 1
          rm: true
  
  sync-to-edit:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    permissions:
      contents: write
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Create temporary directory for blog content
        run: |
          mkdir -p temp_blog
          cp -r src/content/blog/* temp_blog/
      
      - name: Convert relative URLs to absolute URLs
        run: |
          python .github/scripts/convert_to_absolute_urls.py temp_blog
      
      - name: Checkout edit branch
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin edit:edit || git branch edit
          git checkout edit
      
      - name: Sync blog content and workflows to edit branch
        run: |
          # Remove existing blog content
          rm -rf src/content/blog/*
          
          # Copy converted blog content
          cp -r temp_blog/* src/content/blog/
          
          # Sync .github directory (workflows and scripts)
          rm -rf .github
          git checkout dev -- .github
          
          # Add and commit changes
          git add src/content/blog .github
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Sync blog content and workflows from dev branch [skip ci]"
            git push origin edit
          else
            echo "No changes to commit"
          fi
